<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Breast Cancer SVM</title>

    <link rel="stylesheet" href="/static/style.css">
</head>


<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            🧬
        </div>


        <!-- Title -->
        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Create your account to use Breast Cancer SVM
        </p>


        <!-- Error message -->
        <div
            id="error-message"
            class="auth-error"
        >
            {{ error }}
        </div>


        <!-- Register form -->
        <form
            method="post"
            action="/register"
        >

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    minlength="3"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Confirm password -->
            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    minlength="6"
                    required
                >

            </div>


            <!-- Button -->
            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <!-- Login -->
        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>


    <script>

        const errorMessage =
            document.getElementById("error-message");

        if (
            !errorMessage.textContent.trim()
        ) {

            errorMessage.style.display = "none";

        }

    </script>

</body>

</html>
