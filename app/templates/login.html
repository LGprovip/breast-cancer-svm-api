<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Breast Cancer SVM</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🧬
        </div>

        <div class="auth-title">

            <h1>Welcome Back</h1>

            <p>
                Login to Breast Cancer SVM
            </p>

        </div>


        {% if error %}

        <div class="auth-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/login"
        >

            <div class="auth-input">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="auth-input">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
